<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>
       

    <h1>Employee List</h1>
     <table border="2px">
    <tr>
        <th>name</th>
        <th>email</th>
        <th>position</th>
        <th>salary</th>
    </tr>
    {% for i in employee %}
    <tr>
        <td>{{i.name}}</td>
        <td>{{i.email}}</td>
        <td>{{i.position}}</td>
        <td>{{i.salary}}</td>

    </tr>
    {% endfor %}
    </table>
    </center>
</body>
</html>
