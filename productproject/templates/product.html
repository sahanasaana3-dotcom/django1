<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% for i in items %}
    <h2>{{i.name}}</h2>
    <h2>{{i.brand}}</h2>
    <h2>{{i.price}}</h2>
    <h2>{{i.description}}</h2>    
    <img src="{{i.image.url}}" alt="{{i.name}}">
    {% endfor %}
</body>
</html>
