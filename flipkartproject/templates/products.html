
<!DOCTYPE html>
<html>
<head>
    <title>Flipkart Product Details</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #2874f0;
        }

        h2 {
            background: #172337;
            color: white;
            text-align: center;
            padding: 18px;
            margin: 15px;
            border-radius: 10px;
        }

        .product-container {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 20px;
            background: #f1f3f6;
            padding: 25px;
            margin: 15px;
            border-radius: 12px;
        }
        .product-card {
            width: 220px;
            background: white;
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 3px 8px #999;
        }
        .product-card img {
            width: 180px;
            height: 160px;
            object-fit: contain;
        }
        .product-card h3 {
            color: #172337;
        }
        .price {
            color: green;
            font-size: 20px;
            font-weight: bold;
        }
        .product-card p {
            font-size: 14px;
        }
        .buy-btn {
            background: #fb641b;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>Flipkart - Product Details</h2>
    <div class="product-container">
        {% for product in products %}
        <div class="product-card">
            {% if product.image %}
                <img src="{{ product.image.url }}"
                     alt="{{ product.product_name }}">
            {% endif %}
            <h3>{{ product.product_name }}</h3>
            <p><b>Brand:</b> {{ product.brand }}</p>
            <p><b>Material:</b> {{ product.material }}</p>
            <p class="price">₹{{ product.price }}</p>
            <p>
                <b>Description:</b>
                {{ product.description }}
            </p>
            <button class="buy-btn">Buy Now</button>
        </div>
        {% empty %}
            <p>No products available.</p>
        {% endfor %}
    </div>
</body>
</html>
